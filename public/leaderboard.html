<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leaderboard - Jain Talk</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: var(--bg-color);
            padding-bottom: 80px; /* For mobile nav */
        }
        
        .header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            padding: 4rem 1.5rem 3.5rem;
            color: white;
            text-align: center;
            border-bottom-left-radius: 32px;
            border-bottom-right-radius: 32px;
            position: relative;
            box-shadow: 0 10px 30px rgba(255,152,0,0.25);
        }
        
        .back-btn {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            font-weight: 600;
            background: rgba(255,255,255,0.2);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }
        
        .podium-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-top: -3rem;
            gap: 0.5rem;
            padding: 0 1rem;
            z-index: 10;
            position: relative;
        }
        
        .podium-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 30%;
            max-width: 120px;
        }
        
        .podium-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: -15px;
            z-index: 2;
            border: 3px solid;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        .podium-box {
            width: 100%;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 0.5rem 0.5rem;
            text-align: center;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
        }
        
        .podium-name {
            font-weight: 700;
            font-size: 0.8rem;
            margin-bottom: 0.2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }
        
        .podium-score {
            font-size: 0.9rem;
            font-weight: 800;
        }
        
        /* Rank 1 */
        .podium-item.rank-1 .podium-avatar { border-color: #FFD700; color: #FFD700; width: 75px; height: 75px; font-size: 1.5rem; }
        .podium-item.rank-1 .podium-box { height: 140px; background: linear-gradient(to bottom, #FFD700, #F57F17); }
        
        /* Rank 2 */
        .podium-item.rank-2 .podium-avatar { border-color: #C0C0C0; color: #C0C0C0; }
        .podium-item.rank-2 .podium-box { height: 110px; background: linear-gradient(to bottom, #E0E0E0, #9E9E9E); }
        
        /* Rank 3 */
        .podium-item.rank-3 .podium-avatar { border-color: #CD7F32; color: #CD7F32; }
        .podium-item.rank-3 .podium-box { height: 80px; background: linear-gradient(to bottom, #D7CCC8, #8D6E63); }
        
        .list-container {
            padding: 2rem 1rem;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .list-item {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 1.25rem;
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,152,0,0.15);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideUp 0.5s ease backwards;
        }
        
        .list-item:nth-child(even) { animation-delay: 0.1s; }
        .list-item:nth-child(odd) { animation-delay: 0.2s; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .list-item:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 12px 25px rgba(255,152,0,0.15);
        }
        
        .rank-badge {
            width: 32px;
            height: 32px;
            background: #f0f0f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--text-light);
            margin-right: 1rem;
        }
        
        .user-info {
            flex-grow: 1;
        }
        
        .user-name {
            font-weight: 700;
            color: var(--text-dark);
            font-size: 1rem;
            margin-bottom: 0.1rem;
        }
        
        .score-badge {
            background: rgba(255,152,0,0.1);
            color: var(--primary-dark);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.95rem;
        }
        
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-light);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="/home.html" class="back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
            Back
        </a>
        <h1 style="margin: 0; font-size: 2.2rem; font-weight: 800; padding-top: 1rem;">Top Aradhaks</h1>
        <p style="margin-top: 0.5rem; opacity: 0.9; font-weight: 500;">The highest point scorers this season</p>
    </div>

    <div id="podium-area" class="podium-container" style="display: none;">
        <!-- Rank 2 -->
        <div class="podium-item rank-2" id="podium-2" style="display: none;">
            <div class="podium-avatar">2</div>
            <div class="podium-box">
                <div class="podium-name" id="name-2">...</div>
                <div class="podium-score" id="score-2">...</div>
            </div>
        </div>
        
        <!-- Rank 1 -->
        <div class="podium-item rank-1" id="podium-1" style="display: none;">
            <div class="podium-avatar">1</div>
            <div class="podium-box">
                <div class="podium-name" id="name-1" style="font-size: 0.9rem;">...</div>
                <div class="podium-score" id="score-1" style="font-size: 1rem;">...</div>
            </div>
        </div>
        
        <!-- Rank 3 -->
        <div class="podium-item rank-3" id="podium-3" style="display: none;">
            <div class="podium-avatar">3</div>
            <div class="podium-box">
                <div class="podium-name" id="name-3">...</div>
                <div class="podium-score" id="score-3">...</div>
            </div>
        </div>
    </div>

    <div class="list-container" id="leaderboard-list">
        <div class="loading">Loading leaderboard data...</div>
    </div>

    <!-- Mobile Bottom Floating Nav -->
    <nav class="bottom-nav">
        <ul class="nav-items">
            <li class="nav-item" id="mobile-home-btn" onclick="window.location.href='/home.html'">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Home</span>
            </li>
            <li class="nav-item" id="mobile-reels-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
                <span>Reels</span>
            </li>
            <li class="nav-item active" id="mobile-leaderboard-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h20"></path><path d="M5 20v-8"></path><path d="M12 20V4"></path><path d="M19 20v-12"></path></svg>
                <span>Leaders</span>
            </li>
            <li class="nav-item" id="mobile-upload-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                <span>Upload</span>
            </li>
            <li class="nav-item" id="mobile-alerts-btn" style="position: relative;">
                <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                <span>Alerts</span>
            </li>
            <li class="nav-item" id="mobile-profile-btn">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>Profile</span>
            </li>
        </ul>
    </nav>

    <script>
        function getFallbackUsername(user) {
            return 'JT_' + (user._id ? user._id.toString().slice(-4).toUpperCase() : 'XXXX') + '_' + (user.name ? user.name.split(' ')[0] : 'User');
        }

        async function fetchLeaderboard() {
            try {
                const response = await fetch('/api/leaderboard');
                if (!response.ok) throw new Error('Failed to fetch');
                const data = await response.json();
                
                const listContainer = document.getElementById('leaderboard-list');
                listContainer.innerHTML = '';
                
                if (data.length === 0) {
                    listContainer.innerHTML = '<div class="loading">No submissions yet!</div>';
                    return;
                }

                document.getElementById('podium-area').style.display = 'flex';

                data.forEach((user, index) => {
                    const displayUsername = user.username || getFallbackUsername(user);
                    const rank = index + 1;
                    
                    if (rank <= 3) {
                        const pItem = document.getElementById(`podium-${rank}`);
                        if (pItem) {
                            pItem.style.display = 'flex';
                            document.getElementById(`name-${rank}`).textContent = displayUsername;
                            document.getElementById(`score-${rank}`).textContent = user.totalPoints;
                        }
                    } else {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'list-item';
                        itemDiv.innerHTML = `
                            <div class="rank-badge">${rank}</div>
                            <div class="user-info">
                                <div class="user-name">${displayUsername}</div>
                            </div>
                            <div class="score-badge">${user.totalPoints} pts</div>
                        `;
                        listContainer.appendChild(itemDiv);
                    }
                });
                
            } catch (err) {
                console.error(err);
                document.getElementById('leaderboard-list').innerHTML = '<div class="loading" style="color: #F44336;">Error loading leaderboard. Please try again.</div>';
            }
        }
        
        // Auto-fetch on load
        document.addEventListener('DOMContentLoaded', fetchLeaderboard);
    </script>
</body>
</html>
