<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leaderboard - Jain Talk</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            display: block !important;
        }
        
        .header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            padding: 1.5rem;
            color: white;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 15px rgba(255,152,0,0.15);
        }
        
        .back-btn {
            position: absolute;
            top: 50%;
            left: 1rem;
            transform: translateY(-50%);
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            font-weight: 600;
        }
        
        .list-container {
            padding: 1.5rem;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .list-item {
            background: white;
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            align-items: center;
            margin-bottom: 0.75rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid #eee;
        }
        
        .rank-badge {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            margin-right: 1rem;
            background: #f0f0f0;
            color: #555;
        }

        .list-item:nth-child(1) .rank-badge { background: #FFD700; color: #fff; }
        .list-item:nth-child(2) .rank-badge { background: #C0C0C0; color: #fff; }
        .list-item:nth-child(3) .rank-badge { background: #CD7F32; color: #fff; }
        
        .user-info {
            flex-grow: 1;
        }
        
        .user-name {
            font-weight: 600;
            color: #333;
            font-size: 1rem;
        }
        
        .score-badge {
            background: rgba(255,152,0,0.1);
            color: var(--primary-dark);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
        }
        
        .loading {
            text-align: center;
            padding: 3rem;
            color: #777;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="/home.html" class="back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
            Back
        </a>
        <h1 style="margin: 0; font-size: 1.5rem; font-weight: 700;">Leaderboard</h1>
    </div>

    <div class="list-container" id="leaderboard-list">
        <div class="loading">Loading leaderboard data...</div>
    </div>

    <script>
        function getFallbackUsername(user) {
            return 'JT_' + (user._id ? user._id.toString().slice(-4).toUpperCase() : 'XXXX') + '_' + (user.name ? user.name.split(' ')[0] : 'User');
        }

        async function fetchLeaderboard() {
            try {
                const response = await fetch('/api/leaderboard');
                if (!response.ok) throw new Error('Failed to fetch');
                const data = await response.json();
                
                const listContainer = document.getElementById('leaderboard-list');
                listContainer.innerHTML = '';
                
                if (data.length === 0) {
                    listContainer.innerHTML = '<div class="loading">No submissions yet!</div>';
                    return;
                }

                data.forEach((user, index) => {
                    const displayUsername = user.username || getFallbackUsername(user);
                    const rank = index + 1;
                    
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'list-item';
                    itemDiv.innerHTML = `
                        <div class="rank-badge">${rank}</div>
                        <div class="user-info">
                            <div class="user-name">${displayUsername}</div>
                        </div>
                        <div class="score-badge">${user.totalPoints} pts</div>
                    `;
                    listContainer.appendChild(itemDiv);
                });
                
            } catch (err) {
                console.error(err);
                document.getElementById('leaderboard-list').innerHTML = '<div class="loading" style="color: #F44336;">Error loading leaderboard. Please try again.</div>';
            }
        }
        
        // Auto-fetch on load
        document.addEventListener('DOMContentLoaded', fetchLeaderboard);
    </script>
</body>
</html>
